[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-front"
version = "1.0.0"
description = "Ratio objectives, weighted-sum decomposition and a quantum heat engine benchmark for multi-objective optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hugo Campos" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pymoo==0.6.2",
    "sympy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["hidden_front"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
